{% load static  %}
<link rel="stylesheet" href="{% static 'polls/output.css' %}">
<link rel="stylesheet" href="{% static 'polls/style.css' %}">

<!doctype html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Polls</title>
</head>
<body>  
    <div class="page-container">
    
    {% if latest_question_list %}
        <div class="questions-container">
            {% for question in latest_question_list %}
                <div class="question-item">
                    <a href="{% url 'polls:detail' question.id %}">{{ question.question_text }}</a>
                </div>
            {% endfor %}
        </div>
    {% else %}
        <p class="no-polls">No polls are available.</p>
    {% endif %}
    
    
    </div>

    <div class="chat-container">
        <div class="chat chat-start">
        <div id="bot-response" class="chat-bubble">
            Hey, it's LangGraph's AI!
            <br />
            Do you need help with the polls?
            
        </div>
        
        </div>
        <div class="chat chat-end">
        <div class="chat-bubble">
            <form onsubmit="sendMessage(event)">
                {% csrf_token %}
                <input type="text" name="message" placeholder="Type your message here..." class="langgraph_input"></input>
                <button type="submit" class="btn">Send</button>
            </form>
        </div>
        </div>
    </div>

</body>
</html>

<script>
    async function sendMessage(event){
        /*
        DOCS: The preventDefault() method of the Event interface tells the user agent that the event is being explicitly handled,
         so its default action, such as page scrolling, link navigation, or pasting text, should not be taken.
        */
        event.preventDefault();
        const input = document.getElementsByClassName('langgraph_input')[0];
        const user_input = input.value.trim();
        
        const bot_response = document.getElementById('bot-response');

        if(!user_input) return; // Don't send empty messages
        bot_response.innerHTML = '<span class="loading loading-dots loading-md"></span> Thinking...'; //displaying 'loading' state
        try {
            const response = await fetch('/polls/api/chatbot/', {
                method: 'POST',
                headers: {
                    'Content-Type': 'application/json',
                    'X-CSRFToken': '{{ csrf_token }}'
                },
                body: JSON.stringify({ message: user_input })
            });
            const data = await response.json(); //json() takes in the JSON and returns a promise that eventually resolves to a JavaScript object
            console.log(data);

            bot_response.innerHTML = `
                ${data.response}
            `;
            input.value = '';
        } catch (error) {
            console.error('Error:', error);
        }

    }
</script>
